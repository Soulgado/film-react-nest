name: docker-image

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: 
      packages: write
      contents: write
    steps:
      - name: set lower case owner name
        run: /
          echo "REPO=${OWNER,,}" >> ${GITHUB_ENV}
        env: 
          OWNER: '${{ github.repository_owner }}'

      - run: /
          echo "repo ${REPO}"

      - name: Checkout
        uses: actions/checkout@v5
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with: 
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with: 
          context: '{{defaultContenxt}}:backend'
          push: true
          tags: 'ghcr.io/${{ env.REPO }}/film-react-nest-backend:latest'
      
      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with: 
          context: '{{defaultContenxt}}:frontend'
          push: true
          tags: 'ghcr.io/${{ env.REPO }}/film-react-nest-frontend:latest'
      
      - name: Build and push server
        uses: docker/build-push-action@v6
        with: 
          context: '{{defaultContenxt}}:nginx'
          push: true
          tags: 'ghcr.io/${{ env.REPO }}/film-react-nest-server:latest'